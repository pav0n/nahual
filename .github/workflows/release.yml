name: Release

# 007 (FR-039 a FR-042, contracts/release.md): el paquete publicado sale solo de aquí. Build
# reproducible, SBOM y atestaciones en el release de GitHub; la subida a la Chrome Web Store espera
# la aprobación manual del environment `chrome-web-store`, el único con sus credenciales.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SOURCE_DATE_EPOCH: "1767225600"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Un tag de ensayo `vX.Y.Z-rc.N` empaqueta la versión `X.Y.Z`: Chrome solo admite números en
      # `version` del manifest. El release sale como prerelease y no se publica en la tienda.
      - name: La versión del paquete coincide con el tag
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $version de apps/extension/package.json"
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-licenses.mjs
      - run: pnpm verify:dist
      - run: pnpm --filter @nahual/export-smoke test

      - name: Build reproducible (dos builds, mismo SHA-256)
        id: zip
        run: |
          pnpm build --force
          rm -rf "$RUNNER_TEMP/dist-1" && cp -r apps/extension/dist "$RUNNER_TEMP/dist-1"
          first=$(node scripts/build-zip.mjs | cut -d' ' -f1)
          pnpm build --force
          second=$(node scripts/build-zip.mjs | cut -d' ' -f1)
          if [ "$first" != "$second" ]; then
            (cd "$RUNNER_TEMP/dist-1" && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/build-1.txt"
            (cd apps/extension/dist && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/build-2.txt"
            {
              echo "### Build no reproducible: archivos que difieren"
              echo '```'
              diff "$RUNNER_TEMP/build-1.txt" "$RUNNER_TEMP/build-2.txt" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Dos builds del mismo commit dieron $first y $second"
            exit 1
          fi
          echo "sha256=$first" >> "$GITHUB_OUTPUT"

      - run: node scripts/build-sbom.mjs

      - name: Atestación de procedencia del paquete
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apps/extension/nahual.zip

      - name: Atestación del SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apps/extension/nahual.zip
          sbom-path: apps/extension/nahual.sbom.cdx.json

      - name: Release en GitHub con el paquete y su SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Paquete \`nahual.zip\` (SHA-256 \`$SHA256\`), su SBOM CycloneDX y atestaciones de GitHub.

          Verificar antes de instalarlo sin empaquetar:

          \`\`\`sh
          echo "$SHA256  nahual.zip" | sha256sum -c -
          gh attestation verify nahual.zip --repo $GITHUB_REPOSITORY
          \`\`\`

          Listing, permisos y política de privacidad: [docs/store](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME/docs/store).
          EOF
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            apps/extension/nahual.zip apps/extension/nahual.sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "Nahual $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  publish:
    needs: build
    # Los tags de ensayo (`v1.0.0-rc.1`) no llegan a la tienda.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    # Revisores obligatorios: nada se sube sin la aprobación de un mantenedor.
    environment: chrome-web-store
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Descargar el paquete del release y verificarlo
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern nahual.zip
          echo "$SHA256  nahual.zip" | sha256sum -c -
          gh attestation verify nahual.zip --repo "$GITHUB_REPOSITORY"

      - name: Subir y publicar en la Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          token=$(curl --fail-with-body -sS https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" | jq -r .access_token)
          echo "::add-mask::$token"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          api=https://chromewebstore.googleapis.com
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" \
            -T nahual.zip "$api/upload/v2/$item:upload" > upload.json
          # La subida puede ser asíncrona (`IN_PROGRESS`): se consulta fetchStatus hasta 5 minutos.
          state=$(jq -r .uploadState upload.json)
          for _ in $(seq 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            curl --fail-with-body -sS -H "Authorization: Bearer $token" \
              "$api/v2/$item:fetchStatus" > status.json
            state=$(jq -r .lastAsyncUploadState status.json)
          done
          summary() {
            {
              echo "### Chrome Web Store ($GITHUB_REF_NAME)"
              echo '```json'
              jq -s '.' "$@"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$state" != "SUCCEEDED" ]; then
            summary upload.json
            echo "::error::La subida terminó en $state (ver el resumen del job)"
            exit 1
          fi
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" \
            "$api/v2/$item:publish" > publish.json
          summary upload.json publish.json
