name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "1767225600"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-licenses.mjs
      - run: pnpm verify:dist

      # 007 (T035): los workflows se revisan con actionlint, binario verificado por SHA-256.
      - name: actionlint
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Build reproducible (dos builds, mismo SHA-256)
        run: |
          pnpm build --force
          first=$(node scripts/build-zip.mjs | cut -d' ' -f1)
          pnpm build --force
          second=$(node scripts/build-zip.mjs | cut -d' ' -f1)
          echo "build 1: $first"
          echo "build 2: $second"
          test "$first" = "$second"

      - run: pnpm --filter @nahual/extension exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm e2e
