name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "1767225600"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-licenses.mjs
      - run: pnpm verify:dist

      - name: Build reproducible (dos builds, mismo SHA-256)
        run: |
          pnpm build --force
          first=$(node scripts/build-zip.mjs | cut -d' ' -f1)
          pnpm build --force
          second=$(node scripts/build-zip.mjs | cut -d' ' -f1)
          echo "build 1: $first"
          echo "build 2: $second"
          test "$first" = "$second"

      - run: pnpm --filter @nahual/extension exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm e2e
